name: HealthConnect CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify HealthConnect files
        run: |
          echo "Checking HealthConnect project..."
          test -f index.html
          echo "index.html found successfully"

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh

      - name: Build complete
        run: echo "HealthConnect CI pipeline completed successfully!"
